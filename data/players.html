<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title> Dart-Tool </title>
    <link rel="shortcut icon" href="/assets/favicon.ico"/>

    <meta name="description" content="A very cool little devices that is used for displaying and tracking a game of darts." />

    <!-- Fonts -->
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Nunito" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.11.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- scripts -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.11.3/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>

</head>
<body>
    <header>
        <nav>
            <button data-ui="#navigation-drawer" class="circle transparent">
                <i>menu</i>
            </button>
            <h6 class="max center-align">Dart-Tool</h6>
            <button class="circle transparent">
                <img class="responsive" src="/assets/favicon.png">
            </button>
        </nav>
    </header>

    <main class="container">
        <div class="center-align players-header">
            <button class="small-round" data-ui="#addPlayerModal">
                <i class="fa-solid fa-plus"></i>
                <span>Add player</span>
            </button>
        </div>
        <div id="playersList" class="center-align p-4">
            <progress class="circle"></progress>
        </div>
    </main>

    <div class="overlay blur"></div>
    <dialog id="confirmModal">
        <h5>Confirm Removal</h5>
        <div>Are you sure you want to remove <strong id="playerToRemoveName"></strong>?</div>
        <nav class="right-align no-space">
            <button id="cancelRemove" class="transparent link" data-ui="#confirmModal">Cancel</button>
            <button id="confirmRemove" class="transparent link" data-ui="#confirmModal">Confirm</button>
        </nav>
    </dialog>

    <div class="overlay"></div>
    <dialog class="left no-padding" id="navigation-drawer">
        <nav class="drawer">
            <header>
                <nav class="center-align space nav-header">
                    <div class="max">
                        <img src="/assets/favicon.png"  width="150px">
                    </div>
                    <button class="transparent circle large" data-ui="#navigation-drawer">
                        <i>close</i>
                    </button>
                </nav>
            </header>
            <a href="/">
                <i>Menu</i>
                <span class="max">Menu</span>
                <b>24</b>
            </a>
            <hr>
            <a href="/game">
                <i class="fa-brands fa-dart-lang"></i>
                <span>New Game</span>
            </a>
            <a href="/players">
                <i class="fa-solid fa-users"></i>
                <span>Players</span>
            </a>
            <a href="/settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
            <hr>
            <label>Labels</label>
        </nav>
    </dialog>

    <div class="overlay blur"></div>
    <dialog id="addPlayerModal">
        <h5>Add New Player</h5>
        <form id="addPlayerForm">
            <div class="field label border">
                <input type="text" id="newPlayerName" required />
                <label>Name</label>
            </div>
            <nav class="right-align no-space">
                <button type="button" class="transparent link" data-ui="#addPlayerModal">Cancel</button>
                <button type="submit" class="transparent link" data-ui="#addPlayerModal">Add</button>
            </nav>
        </form>
    </dialog>
    <script src="app.js"></script>
</body>
</html>
