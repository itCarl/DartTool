<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <title> Dart-Tool </title>
    <link rel="shortcut icon" href="/assets/favicon.ico"/>

    <meta name="description" content="A very cool little devices that is used for displaying and tracking a game of darts." />

    <!-- Fonts -->
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css?family=Nunito" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Styles -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.11.3/dist/cdn/beer.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
    <!-- scripts -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.11.3/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.2/dist/cdn/material-dynamic-colors.min.js"></script>

</head>
<body>
    <header>
        <nav>
            <button data-ui="#navigation-drawer" class="circle transparent">
                <i>menu</i>
            </button>
            <h6 class="max center-align">Dart-Tool</h6>
            <button class="circle transparent">
                <img class="responsive" src="/assets/favicon.png">
            </button>
        </nav>
    </header>

    <main class="container">
        <div class="center-align p-4">
            <a href="/game" class="home-link">
                <article id="newGameBtn" class="withIcon">
                    <i class="fa-brands fa-dart-lang"></i>
                    Neues Spiel
                </article>
            </a>
            <a href="/players" class="home-link">
                <article class="withIcon">
                    <i class="fa-solid fa-users"></i>
                    Spieler
                </article>
            </a>
            <a href="/settings" class="home-link">
                <article class="withIcon">
                    <i class="fa-solid fa-gear"></i>
                    Einstellungen
                </article>
            </a>
            <a href="/debug" class="home-link">
                <article class="withIcon">
                    <i class="fa-solid fa-bug"></i>
                    Debug
                </article>
            </a>
        </div>
    </main>

    <div class="overlay"></div>
    <dialog class="left no-padding" id="navigation-drawer">
        <nav class="drawer">
            <header>
                <nav class="center-align space nav-header">
                    <div class="max">
                        <img src="/assets/favicon.png"  width="150px">
                    </div>
                    <button class="transparent circle large" data-ui="#navigation-drawer">
                        <i>close</i>
                    </button>
                </nav>
            </header>
            <a href="/">
                <i>home</i>
                <span class="max">Menu</span>
            </a>
            <hr>
            <a href="/game">
                <i class="fa-brands fa-dart-lang"></i>
                <span>New Game</span>
            </a>
            <a href="/players">
                <i class="fa-solid fa-users"></i>
                <span>Players</span>
            </a>
            <a href="/settings">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
            <a href="/debug">
                <i class="fa-solid fa-bug"></i>
                <span>Debug</span>
            </a>
            <hr>
        </nav>
    </dialog>
    <script src="app.js"></script>
</body>
</html>
